<style>
:root{--bg:#f4f5f7;--sf:#ffffff;--tx:#1a2234;--mt:#64748b;--ln:#cbd5e1;--pr:#1e3a5f;--pt:#ffffff;--ac:#c59b27;--ok:#15803d;--er:#b91c1c;--sel:#e2e8f0;--gl:#1e3a5f0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--sf:#1e293b;--tx:#f8fafc;--mt:#94a3b8;--ln:#334155;--pr:#d4af37;--pt:#0f172a;--ac:#38bdf8;--ok:#4ade80;--er:#f87171;--sel:#334155;--gl:#ffffff0a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:28px 28px;color:var(--tx);font-family:Jost,Vazirmatn,Tahoma,Arial,sans-serif;line-height:1.8;font-size:15px}
header{background:var(--sf);color:var(--tx);border-bottom:3px solid var(--pr);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--mt)}
header select{width:auto;font-weight:600}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;min-width:100px;border:1px solid var(--ln);background:none;color:var(--mt);padding:6px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--pr)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12.5px;color:var(--mt);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:7px;padding:7px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
details{border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin-bottom:10px}
summary{cursor:pointer;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between}
.cnt{font-weight:700;font-size:12.5px;color:var(--ok)}
.it{border-top:1px solid var(--ln);padding:8px 14px}
.it.on{background:var(--sel)}
.it>label.row{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--tx);cursor:pointer;margin:0}
.it input[type=checkbox]{width:19px;height:19px;accent-color:var(--pr);flex:none}
.det{display:none;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-top:8px}
.it.on .det{display:grid}
.it:not(.lm) .m{display:none}
.det .w{grid-column:1/-1}
.bar{position:fixed;inset:auto 0 0 0;background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:6}
.btn{border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--pr);color:var(--pt)}
.btn.s{background:none;color:var(--pr);border:1px solid var(--pr)}
.msg{color:var(--er);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid var(--ln);padding:4px 6px;text-align:start}
.sum td:first-child{font-weight:700}
.scroll{overflow-x:auto}
.doc{background:#fff;color:#111;border:1px solid var(--ln);border-radius:8px;padding:20px;font-size:14px;line-height:2}
.doc h1{text-align:center;font-size:19px;margin:0 0 10px}
.doc h4{margin:12px 0 0;font-size:14.5px}
.doc p{margin:0 0 4px;text-align:justify}
.doc th{background:#eee}.doc td,.doc th{border-color:#999}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;text-align:center}
.sig div{border-top:1px solid #333;padding-top:6px}
.note{font-size:12.5px;color:var(--mt);background:var(--sel);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.card,details,input,select,textarea,.btn,nav button,.note{border-radius:2px!important}.logo{height:30px}@media(prefers-color-scheme:dark){.logo{filter:invert(1)}}canvas.pad{width:100%;height:90px;background:#fff;border:1px solid var(--ln);touch-action:none;display:block}.locked .card,.locked details{pointer-events:none;opacity:.6}.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.chip{border:0;border-radius:999px!important;padding:9px 18px;background:var(--ac);color:#0d2418;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}.chip:hover{filter:brightness(1.07)}.it .lt{color:var(--pr)}.letter{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:12px;font-size:12px}.letter img{height:36px}.hs{font-family:monospace;font-size:11px;word-break:break-all}@media print{header,nav,.bar,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.doc{border:0;padding:0}}
</style>

["موضوع و دامنه|الموضوع والنطاق|Subject & scope|Konu ve kapsam","اجرای کار {ptype} به نشانی {site} مطابق جدول زیر. اهداف: {goals}. در ردیف‌های «فقط دستمزد» مصالح را کارفرما تأمین می‌کند.|تنفيذ أعمال {ptype} في {site} وفق الجدول أدناه. الأهداف: {goals}. في بنود «أجور فقط» يوفر صاحب العمل المواد.|{ptype} works at {site} as per the table below. Goals: {goals}. For ‘labor only’ items the Employer supplies the materials.|{site} adresinde {ptype} işleri aşağıdaki tabloya göre yapılacaktır. Hedefler: {goals}. «Sadece işçilik» kalemlerinde malzemeyi işveren temin eder."],

["زمان|المدة|Time|Süre","شروع {start}، پایان {end}. تأخیر غیرمجاز پیمان‌کار روزانه {pen}٪ مبلغ کل جریمه دارد (حداکثر ۱۰٪). تأخیر ناشی از کارفرما (محل، پرداخت، مصالح) مدت را تمدید می‌کند.|البدء {start}، الانتهاء {end}. تأخير المقاول غير المبرر يستوجب غرامة {pen}٪ يومياً من الإجمالي (بحد أقصى 10٪). تأخير صاحب العمل (الموقع، الدفع، المواد) يمدد المدة.|Start {start}, end {end}. Unjustified contractor delay incurs {pen}% of the total per day (cap 10%). Employer-caused delay (site, payment, materials) extends the period.|Başlangıç {start}, bitiş {end}. Yüklenicinin haksız gecikmesinde günlük %{pen} ceza (en çok %10). İşverenden kaynaklı gecikme (saha, ödeme, malzeme) süreyi uzatır."],
["تعهدات کارفرما|التزامات صاحب العمل|Employer duties|İşveren yükümlülükleri","تحویل محل در موعد، پرداخت به موقع، اعلام کتبی انتخاب‌ها، تأمین مصالح ردیف‌های «فقط دستمزد» با کیفیت و زمان مناسب، هماهنگی با مدیریت ساختمان یا مجتمع تجاری.|تسليم الموقع في موعده، الدفع في الوقت، إبلاغ الاختيارات كتابياً، توفير مواد بنود «أجور فقط» بجودة ووقت مناسبين، والتنسيق مع إدارة المبنى أو المجمع.|Hand over the site on time, pay on schedule, confirm choices in writing, supply materials for labor-only items in suitable quality and time, and coordinate with building or mall management.|Sahayı zamanında teslim etmek, zamanında ödemek, seçimleri yazılı bildirmek, «sadece işçilik» malzemesini uygun kalite ve zamanda sağlamak, bina/AVM yönetimiyle koordinasyon."],
["تعهدات پیمان‌کار|التزامات المقاول|Contractor duties|Yüklenici yükümlülükleri","اجرای فنی و استاندارد؛ تأمین مصالح با برند توافق‌شده در ردیف‌های «دستمزد + مصالح»؛ تأمین نیرو، بیمه و دستمزد کارگران؛ رعایت ایمنی، حفظ اموال، نظافت و رازداری؛ عدم واگذاری کار به غیر بدون اجازه کتبی. در ردیف‌های «فقط دستمزد» مسئولیت او محدود به کیفیت اجراست و عیب آشکار مصالح را باید پیش از مصرف کتبی اعلام کند.|التنفيذ الفني وفق المعايير؛ توريد المواد بالماركة المتفق عليها في بنود «أجور + مواد»؛ توفير العمال والتأمين والأجور؛ السلامة وحماية الممتلكات والنظافة والسرية؛ عدم التنازل عن العمل دون إذن كتابي. في بنود «أجور فقط» تقتصر مسؤوليته على جودة التنفيذ ويبلغ كتابياً عن عيوب المواد الظاهرة قبل الاستخدام.|Technical work to standard; supply materials of the agreed brand for ‘labor + materials’ items; provide workers, insurance and wages; safety, protection of property, cleaning and confidentiality; no subcontracting without written consent. For ‘labor only’ items liability is limited to workmanship, and visible material defects must be reported in writing before use.|Standartlara uygun uygulama; «işçilik + malzeme» kalemlerinde mutabık markada malzeme; işçi, sigorta ve ücretler; iş güvenliği, mal koruma, temizlik ve gizlilik; yazılı izin olmadan devir yok. «Sadece işçilik» kalemlerinde sorumluluk işçilikle sınırlıdır; görünür malzeme kusurları kullanımdan önce yazılı bildirilir."],
["تغییرات|التغييرات|Changes|Değişiklikler","هر کار اضافه یا حذف‌شده فقط با دستور تغییر کتبی و امضای هر دو طرف (همراه مبلغ و زمان) معتبر است.|لا يُعتد بأي إضافة أو حذف إلا بأمر تغيير كتابي موقع من الطرفين يتضمن المبلغ والمدة.|Any addition or omission is valid only by a written variation order signed by both parties stating cost and time.|Her ilave veya eksiltme, bedel ve süreyi içeren ve iki tarafça imzalanan yazılı değişiklik emriyle geçerlidir."],
["تحویل و ضمانت|التسليم والضمان|Handover & warranty|Teslim ve garanti","پس از اتمام، صورت‌جلسه تحویل امضا می‌شود. پیمان‌کار {war} ماه عیوب اجرایی (و مصالح تأمینی خود) را رایگان رفع می‌کند؛ استفاده نادرست مستثنی است.|عند الانتهاء يوقع محضر تسليم. يضمن المقاول عيوب التنفيذ (ومواده) لمدة {war} شهراً ويصلحها مجاناً، ويستثنى سوء الاستخدام.|A handover record is signed on completion. The Contractor remedies workmanship defects (and own supplied materials) free for {war} months; misuse is excluded.|Bitişte teslim tutanağı imzalanır. Yüklenici {war} ay boyunca işçilik (ve kendi malzeme) kusurlarını ücretsiz giderir; hatalı kullanım hariçtir."],
["فسخ و قوه قهریه|الفسخ والقوة القاهرة|Termination & force majeure|Fesih ve mücbir sebep","در تخلف اساسی (عدم پرداخت یا توقف کار بیش از ۷ روز) طرف مقابل پس از اخطار کتبی و ۷ روز مهلت می‌تواند فسخ کند و کار انجام‌شده تسویه می‌شود. حوادث خارج از اراده طرفین مدت را تمدید می‌کند.|عند مخالفة جوهرية (عدم الدفع أو توقف العمل أكثر من 7 أيام) يجوز للطرف الآخر الفسخ بعد إنذار كتابي ومهلة 7 أيام وتسوى الأعمال المنجزة. القوة القاهرة تمدد المدة.|On material breach (non-payment or work stoppage over 7 days) the other party may terminate after written notice and 7 days to cure; completed work is settled. Force majeure extends the period.|Esaslı ihlalde (ödememe veya 7 günü aşan durma) karşı taraf yazılı ihtar ve 7 gün süre sonrası feshedebilir; yapılan iş tasfiye edilir. Mücbir sebep süreyi uzatır."],
["قانون و حل اختلاف|القانون وحل النزاعات|Law & disputes|Hukuk ve uyuşmazlık","قرارداد تابع قوانین {law} است؛ اختلاف ابتدا با مذاکره و سپس در مراجع صالح همان کشور حل می‌شود. در اختلاف ترجمه، متن زبان {ln} ملاک است.|يخضع العقد لقوانين {law}؛ تحل النزاعات بالتفاوض ثم أمام الجهات المختصة في ذلك البلد. عند اختلاف الترجمة يعتد بنص لغة {ln}.|This contract is governed by the laws of {law}; disputes go first to negotiation, then to the competent authorities there. In case of translation discrepancy the {ln} text prevails.|Sözleşme {law} hukukuna tabidir; uyuşmazlıklar önce görüşmeyle, sonra o ülkenin yetkili mercilerinde çözülür. Çeviri farkında {ln} metni esastır."]];

const fi=(k,x,m)=>`<div class="${m?"m":""}"><label>${u(k)}</label><input inputmode="decimal" data-f="${k}" value="${esc(x[k]??"")}"></div>`,ft=(k,x)=>`<div><label>${u(k)}</label><input data-f="${k}" value="${esc(x[k])}"></div>`;
function catsHTML(ord){return ord.map(ci=>{const c=CATS[ci],n=c[1].filter((_,i)=>S.sel[ci+"_"+i]).length;return `<details ${n?"open":""}><summary><span>${pick(c[0])}</span><span class="cnt" id="c${ci}">${n||""}</span></summary>${c[1].map((it,ii)=>{const k=ci+"_"+ii,x=S.sel[k]||{};return `<div class="it ${S.sel[k]?"on":""} ${x.mode=="LM"?"lm":""}" data-k="${k}"><label class="row"><input type="checkbox" data-ck="${k}" data-ci="${ci}" ${S.sel[k]?"checked":""}>${pick(it)}<b class="lt" style="margin-inline-start:auto">${S.sel[k]?fm(lineT(x)):""}</b></label><div class="det"><div class="w"><label>${u("mode")}</label><select data-f="mode"><option value="L" ${x.mode=="L"?"selected":""}>${u("L")}</option><option value="LM" ${x.mode=="LM"?"selected":""}>${u("LM")}</option></select></div>${fi("qty",x)}<div><label>m² / m / #</label><select data-f="unit">${["m²","m","#","set"].map(m=>`<option ${x.unit==m?"selected":""}>${m}</option>`).join("")}</select></div>${fi("lab",x)}${fi("mat",x,1)}${ft("brand",x)}${ft("color",x)}${ft("matl",x)}<div class="w"><label>${u("note")}</label><input data-f="note" value="${esc(x.note)}"></div><label class="w" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-f="inc" ${x.inc?"checked":""} style="width:auto">${u("inc")}</label></div></div>`}).join("")}</details>`}).join("")}
function custHTML(){S.cust=S.cust||[];return `<div class="card"><h3>${u("cust")}</h3><p class="note">${u("custn")}</p>${S.cust.map((r,i)=>`<div class="cl g" data-i="${i}" style="border-top:1px solid var(--ln);padding-top:8px;margin-top:8px"><div style="grid-column:1/-1"><label>${u("desc")}</label><input data-cf="d" value="${esc(r.d)}"></div><div><label>${u("brand")}</label><input data-cf="brand" value="${esc(r.brand)}"></div><div><label>${u("color")}</label><input data-cf="color" value="${esc(r.color)}"></div><div><label>${u("qty")}</label><input inputmode="decimal" data-cf="q" value="${esc(r.q)}"></div><div><label>${u("price")}</label><input inputmode="decimal" data-cf="p" value="${esc(r.p)}"></div><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-cf="est" ${r.est?"checked":""} style="width:auto">${u("est")}</label><b class="lt">${fm((+r.q||0)*(+r.p||0))}</b><button class="btn s" data-cd="${i}">${u("rm")}</button></div>`).join("")}<button class="btn" data-ca="1" style="margin-top:10px">+ ${u("addl")}</button></div>`}
function custRows(){return (S.cust||[]).map(r=>{const q=+r.q||0,p=+r.p||0;return `<tr><td>+</td><td>${esc(r.d)}${r.est?" ("+u("est")+")":""}</td><td>-</td><td>${esc([r.brand,r.color].filter(Boolean).join(" / "))||"-"}</td><td>${fm(q)}</td><td>${fm(p)}</td><td>-</td><td>${fm(q*p)}</td></tr>`}).join("")}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.cf===undefined)return;const r=S.cust[+t.closest(".cl").dataset.i];r[t.dataset.cf]=t.type=="checkbox"?t.checked:t.value;save();upd()});
document.addEventListener("click",e=>{const d=e.target.dataset;if(d.ca){S.cust.push({d:"",brand:"",color:"",q:"",p:"",est:false});save();render()}if(d.cd!==undefined){S.cust.splice(+d.cd,1);save();render()}});
render();
</script>
</body>
</html>
